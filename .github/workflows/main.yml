name: Generar guias EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: epg-dash-guides
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear carpeta de salida
        run: mkdir -p guides

      - name: Generar guias
        run: |
          echo "Generando mi.tv..."
          npm run grab -- --site=mi.tv --output=guides/mi.tv/{lang}.xml

          echo "Generando movistarplus.es..."
          npm run grab -- --site=movistarplus.es --output=guides/movistarplus.es/{lang}.xml

          echo "Generando tvinsider.com..."
          npm run grab -- --site=tvinsider.com --output=guides/tvinsider.com/{lang}.xml

          echo "Generando tvpassport.com..."
          npm run grab -- --site=tvpassport.com --output=guides/tvpassport.com/{lang}.xml

      - name: Commit si hubo cambios
        id: commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guides

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Actualizar guias EPG"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.commit_changes.outputs.has_changes == 'true'
        run: git push
